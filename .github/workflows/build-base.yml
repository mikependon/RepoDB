name: Build & Run Tests - Base

on:
  workflow_call:
    inputs:
      solution-dir:
        description: 'Directory containing the solution file, relative to repo root (e.g. RepoDb.MySql or RepoDb.Extensions/RepoDb.PostgreSql.BulkOperations)'
        required: true
        type: string
      solution-file:
        description: 'Name of the .sln file (e.g. RepoDb.MySql.sln)'
        required: true
        type: string
      artifact-name:
        description: 'Name for the uploaded NuGet artifact'
        required: true
        type: string
      db-engine:
        description: 'Database service required for this build: none, sqlserver, postgresql, mysql, mariadb, oracle, db2, clickhouse, firebird, vertica, enterprisedb, saphana'
        required: true
        type: string

env:
  # SQL Server
  REPODB_SQLSVR_CONSTR_MASTER: "Server=tcp:127.0.0.1,1433;Database=master;User ID=sa;Password=RepoDB2026;TrustServerCertificate=True;"
  REPODB_SQLSVR_CONSTR: "Server=tcp:127.0.0.1,1433;Database=RepoDb;User ID=sa;Password=RepoDB2026;TrustServerCertificate=True;"
  REPODB_SQLSVR_CONSTR_BULK: "Server=tcp:127.0.0.1,1433;Database=RepoDbBulk;User ID=sa;Password=RepoDB2026;TrustServerCertificate=True;"
  # PostgreSQL
  REPODB_PGSQL_CONSTR_POSTGRES: "Server=127.0.0.1;Port=5432;Database=postgres;User Id=postgres;Password=RepoDB2026;"
  REPODB_PGSQL_CONSTR: "Server=127.0.0.1;Port=5432;Database=RepoDb;User Id=postgres;Password=RepoDB2026;"
  REPODB_PGSQL_CONSTR_BULK: "Server=127.0.0.1;Port=5432;Database=RepoDbBulk;User Id=postgres;Password=RepoDB2026;"
  # MySQL
  REPODB_MYSQL_CONSTR_SYSTEM: "Server=127.0.0.1;Port=3306;Database=sys;User ID=root;Password=RepoDB2026;"
  REPODB_MYSQL_CONSTR: "Server=127.0.0.1;Port=3306;Database=RepoDb;User ID=root;Password=RepoDB2026;AllowLoadLocalInfile=True;AllowUserVariables=True;"
  # MariaDB
  REPODB_MARIADB_CONSTR_SYSTEM: "Server=127.0.0.1;Port=3307;Database=sys;User ID=root;Password=RepoDB2026;"
  REPODB_MARIADB_CONSTR: "Server=127.0.0.1;Port=3307;Database=RepoDb;User ID=root;Password=RepoDB2026;AllowLoadLocalInfile=True;AllowUserVariables=True;"
  # SQLite — set to in-memory so no file-system setup is required on the runner
  REPODB_SQLITE_IS_IN_MEMORY: "true"
  # Oracle
  REPODB_ORACLE_CONSTR: "User Id=system;Password=RepoDB2026;Data Source=127.0.0.1:1521/FREEPDB1;"
  # Db2
  REPODB_DB2_CONSTR: "Server=127.0.0.1:50000;Database=REPODB;UID=db2inst1;PWD=RepoDB2026;"
  # ClickHouse
  REPODB_CLICKHOUSE_CONSTR: "Host=127.0.0.1;Port=8123;Protocol=http;Database=RepoDb;Username=default;Password=RepoDB2026;UseCustomDecimals=false;"
  # Firebird — Pooling=false so RECREATE TABLE never collides with a leftover implicit
  # transaction carried over on a pooled connection from an earlier test (see Database.cs).
  REPODB_FIREBIRD_CONSTR: "DataSource=127.0.0.1;Port=3050;Database=/firebird/data/repodb.fdb;User=SYSDBA;Password=RepoDB2026;Charset=UTF8;Pooling=false;"
  # Vertica
  REPODB_VERTICA_CONSTR: "Host=127.0.0.1;Port=5433;Database=RepoDb;User=dbadmin;Password=RepoDB2026;"
  # EnterpriseDB (EDB Postgres Advanced Server)
  REPODB_EDB_CONSTR_SYSTEM: "Server=127.0.0.1;Port=5444;Database=edb;User Id=enterprisedb;Password=RepoDB2026;"
  REPODB_EDB_CONSTR: "Server=127.0.0.1;Port=5444;Database=RepoDb;User Id=enterprisedb;Password=RepoDB2026;"
  # SAP HANA
  REPODB_SAPHANA_CONSTR: "Server=127.0.0.1:39041;UserID=SYSTEM;Password=RepoDB2026;Current Schema=REPODB;"

jobs:

  # No external database required (e.g. RepoDb.Core, RepoDb.Sqlite.Microsoft, RepoDb.Telemetry.*)
  build-none:
    if: inputs.db-engine == 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # SQL Server only (e.g. RepoDb.SqlServer, RepoDb.SqlServer.BulkOperations)
  build-sqlserver:
    if: inputs.db-engine == 'sqlserver'
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 127.0.0.1:1433:1433
        env:
          ACCEPT_EULA: true
          MSSQL_SA_PASSWORD: RepoDB2026

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # PostgreSQL only (e.g. RepoDb.PostgreSql, RepoDb.PostgreSql.BulkOperations)
  build-postgresql:
    if: inputs.db-engine == 'postgresql'
    runs-on: ubuntu-latest

    services:
      postgresql:
        image: postgres:latest
        ports:
          - 127.0.0.1:5432:5432
        env:
          POSTGRES_PASSWORD: RepoDB2026

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # MySQL only (e.g. RepoDb.MySql, RepoDb.MySqlConnector)
  build-mysql:
    if: inputs.db-engine == 'mysql'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        ports:
          - 127.0.0.1:3306:3306
        env:
          MYSQL_ROOT_PASSWORD: RepoDB2026

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # MariaDB only (e.g. RepoDb.MariaDb, RepoDb.MariaDb.BulkOperations)
  build-mariadb:
    if: inputs.db-engine == 'mariadb'
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 127.0.0.1:3307:3306
        env:
          MARIADB_ROOT_PASSWORD: RepoDB2026

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # Db2 only (e.g. RepoDb.Db2, RepoDb.Db2.BulkOperations)
  build-db2:
    if: inputs.db-engine == 'db2'
    runs-on: ubuntu-latest

    services:
      db2:
        image: icr.io/db2_community/db2:latest
        ports:
          - 127.0.0.1:50000:50000
        env:
          LICENSE: accept
          DB2INSTANCE: db2inst1
          DB2INST1_PASSWORD: RepoDB2026
          DBNAME: REPODB
          # Per Testcontainers' own Db2Container (which targets this same
          # icr.io/db2_community/db2 image): these two settings help the container reach
          # readiness faster, on top of the explicit wait step below.
          AUTOCONFIG: "false"
          ARCHIVE_LOGS: "false"
        options: >-
          --privileged
          --health-cmd "exit 0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 1
          --health-start-period 1s

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Wait for Db2 service to be ready
        run: |
          CID=$(docker ps -q --filter "ancestor=icr.io/db2_community/db2:latest")
          if [ -z "$CID" ]; then
            echo "Could not find the Db2 service container."
            exit 1
          fi
          echo "Db2 container id: $CID"
          for i in $(seq 1 60); do
            if docker logs "$CID" 2>&1 | grep -q "Setup has completed"; then
              echo "Db2 is ready (after $((i * 10))s)."
              exit 0
            fi
            echo "Waiting for Db2 to become ready... attempt $i/60"
            sleep 10
          done
          echo "Db2 did not become ready within the timeout. Recent container logs:"
          docker logs "$CID" --tail 200
          exit 1

      - name: Locate Db2 native driver libraries (clidriver)
        run: |
          SEARCH_ROOT="$(pwd)/${{ inputs.solution-dir }}"
          echo "Searching for libdb2.so under $SEARCH_ROOT ..."
          find "$SEARCH_ROOT" -type f -name "libdb2.so" -print
          DIRS=$(find "$SEARCH_ROOT" -type f -name "libdb2.so" -exec dirname {} \; | sort -u | tr '\n' ':')
          if [ -z "$DIRS" ]; then
            echo "::warning::No libdb2.so found under $SEARCH_ROOT - the Db2 integration tests will likely fail to load the native driver. Check that Net.IBM.Data.Db2-lnx restored correctly for the linux-x64 build."
          fi
          echo "LD_LIBRARY_PATH=$DIRS" >> "$GITHUB_ENV"
          echo "Resolved LD_LIBRARY_PATH=$DIRS"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # Oracle only (e.g. RepoDb.Oracle, RepoDb.Oracle.BulkOperations)
  build-oracle:
    if: inputs.db-engine == 'oracle'
    runs-on: ubuntu-latest

    services:
      oracle:
        image: container-registry.oracle.com/database/free:latest
        ports:
          - 127.0.0.1:1521:1521
        env:
          ORACLE_PWD: RepoDB2026
        options: >-
          --health-cmd "exit 0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 1
          --health-start-period 1s

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      # - name: Wait for Oracle service to be ready
      #   run: |
      #     CID=$(docker ps -q --filter "ancestor=container-registry.oracle.com/database/free:latest")
      #     if [ -z "$CID" ]; then
      #       echo "Could not find the Oracle service container."
      #       exit 1
      #     fi
      #     echo "Oracle container id: $CID"
      #     for i in $(seq 1 150); do
      #       if docker exec "$CID" healthcheck.sh > /dev/null 2>&1; then
      #         echo "Oracle is ready (after $((i * 15))s)."
      #         exit 0
      #       fi
      #       echo "Waiting for Oracle to become ready... attempt $i/150"
      #       sleep 15
      #     done
      #     echo "Oracle did not become ready within the timeout. Recent container logs:"
      #     docker logs "$CID" --tail 200
      #     exit 1

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # Firebird only (e.g. RepoDb.Firebird, RepoDb.Firebird.BulkOperations)
  build-firebird:
    if: inputs.db-engine == 'firebird'
    runs-on: ubuntu-latest

    services:
      firebird:
        image: jacobalberty/firebird:latest
        ports:
          - 127.0.0.1:3050:3050
        env:
          ISC_PASSWORD: RepoDB2026
          FIREBIRD_DATABASE: repodb.fdb

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Wait for Firebird service to be ready
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3050) 2>/dev/null; then
              exec 3<&- 2>/dev/null
              exec 3>&- 2>/dev/null
              echo "Firebird is ready (after $((i * 5))s)."
              exit 0
            fi
            echo "Waiting for Firebird to become ready... attempt $i/30"
            sleep 5
          done
          echo "Firebird did not become ready within the timeout."
          exit 1

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # ClickHouse only (e.g. RepoDb.ClickHouse, RepoDb.ClickHouse.BulkOperations)
  build-clickhouse:
    if: inputs.db-engine == 'clickhouse'
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 127.0.0.1:8123:8123
          - 127.0.0.1:9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: RepoDB2026
          CLICKHOUSE_DB: RepoDb
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # EnterpriseDB (EDB Postgres Advanced Server) only (e.g. RepoDb.EnterpriseDb, RepoDb.EnterpriseDb.BulkOperations)
  build-enterprisedb:
    if: inputs.db-engine == 'enterprisedb'
    runs-on: ubuntu-latest

    services:
      enterprisedb:
        image: docker.enterprisedb.com/k8s/edb-postgres-advanced:18
        # Official EDB image - the registry requires an EDB subscription. Configure the
        # EDB_DOCKER_USERNAME/EDB_DOCKER_PASSWORD repository secrets (see docker-compose.yml's
        # comment on the equivalent local service) before this job can pull it.
        credentials:
          username: ${{ secrets.EDB_DOCKER_USERNAME }}
          password: ${{ secrets.EDB_DOCKER_PASSWORD }}
        ports:
          - 127.0.0.1:5444:5444
        env:
          ACCEPT_EULA: Y
          ENTERPRISEDB_PASSWORD: RepoDB2026
          DATABASE_NAME: repodb

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Wait for EnterpriseDB service to be ready
        run: |
          CID=$(docker ps -q --filter "ancestor=docker.enterprisedb.com/k8s/edb-postgres-advanced:18")
          if [ -z "$CID" ]; then
            echo "Could not find the EnterpriseDB service container."
            exit 1
          fi
          echo "EnterpriseDB container id: $CID"
          for i in $(seq 1 60); do
            if docker exec "$CID" pg_isready -h 127.0.0.1 -p 5444 -U enterprisedb > /dev/null 2>&1; then
              echo "EnterpriseDB is ready (after $((i * 5))s)."
              exit 0
            fi
            echo "Waiting for EnterpriseDB to become ready... attempt $i/60"
            sleep 5
          done
          echo "EnterpriseDB did not become ready within the timeout. Recent container logs:"
          docker logs "$CID" --tail 200
          exit 1

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

  # SAP HANA only (e.g. RepoDb.SapHana, RepoDb.SapHana.BulkOperations)
  build-saphana:
    if: inputs.db-engine == 'saphana'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      # SAP HANA Express requires --agree-to-sap-license/--master-password as container command
      # args, which the `services:` block used by every other engine above cannot express (it only
      # supports image/env/ports/volumes/options, not a command override) - so it's started by hand
      # instead. Mirrors the equivalent local service in docker-compose.yml.
      - name: Start SAP HANA service
        run: |
          docker run -d --name saphana --privileged \
            -p 127.0.0.1:39013:39013 \
            -p 127.0.0.1:39015:39015 \
            -p 127.0.0.1:39017:39017 \
            -p 127.0.0.1:39041-39045:39041-39045 \
            -p 127.0.0.1:1128-1129:1128-1129 \
            -p 127.0.0.1:59013-59014:59013-59014 \
            --ulimit nofile=1048576:1048576 \
            --sysctl kernel.shmmax=1073741824 \
            --sysctl net.ipv4.ip_local_port_range="40000 60999" \
            --sysctl kernel.shmmni=524288 \
            --sysctl kernel.shmall=8388608 \
            saplabs/hanaexpress:2.00.061.00.20220519.1 \
            --agree-to-sap-license --master-password RepoDB2026

      - name: Wait for SAP HANA service to be ready
        run: |
          for i in $(seq 1 90); do
            if docker logs saphana 2>&1 | grep -q "Startup finished!"; then
              echo "SAP HANA is ready (after $((i * 10))s)."
              exit 0
            fi
            echo "Waiting for SAP HANA to become ready... attempt $i/90"
            sleep 10
          done
          echo "SAP HANA did not become ready within the timeout. Recent container logs:"
          docker logs saphana --tail 200
          exit 1

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg

      - name: Stop SAP HANA service
        if: always()
        run: docker rm -f saphana || true

  # Vertica only (e.g. RepoDb.Vertica, RepoDb.Vertica.BulkOperations)
  build-vertica:
    if: inputs.db-engine == 'vertica'
    runs-on: ubuntu-latest

    services:
      vertica:
        image: molo17/vertica-ce:24.1.0-0
        ports:
          - 127.0.0.1:5433:5433
        env:
          # This image only sets a password on VERTICA_DB_NAME's superuser (dbadmin) when
          # APP_DB_USER is ALSO given - the alter-password step it runs is unconditional, so
          # pointing APP_DB_USER at the existing "dbadmin" account (rather than a new app-only
          # one) just sets its password. Mirrors the same setup in docker-compose.yml.
          VERTICA_DB_NAME: RepoDb
          APP_DB_USER: dbadmin
          APP_DB_PASSWORD: RepoDB2026

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup .NET Versions
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Dotnet Build
        run: dotnet build -c release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Wait for Vertica service to be ready
        run: |
          CID=$(docker ps -q --filter "ancestor=molo17/vertica-ce:24.1.0-0")
          if [ -z "$CID" ]; then
            echo "Could not find the Vertica service container."
            exit 1
          fi
          echo "Vertica container id: $CID"
          for i in $(seq 1 60); do
            if docker exec "$CID" /opt/vertica/bin/vsql -U dbadmin -w RepoDB2026 -d RepoDb -c "SELECT 1" > /dev/null 2>&1; then
              echo "Vertica is ready (after $((i * 10))s)."
              exit 0
            fi
            echo "Waiting for Vertica to become ready... attempt $i/60"
            sleep 10
          done
          echo "Vertica did not become ready within the timeout. Recent container logs:"
          docker logs "$CID" --tail 200
          exit 1

      - name: Test for .NET 8.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net8.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 9.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net9.0 --no-build ${{ inputs.solution-file }}

      - name: Test for .NET 10.0
        working-directory: ${{ inputs.solution-dir }}
        run: dotnet test -c release -f net10.0 --no-build -p:TestingPlatformDotnetTestSupport=true -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCaptureOutput=false ${{ inputs.solution-file }}

      - name: Run Dotnet Pack
        run: dotnet pack -c release -p Version="1.14.0-dev-${{ github.run_number }}" -o release "${{ inputs.solution-dir }}/${{ inputs.solution-file }}"

      - name: Package Nuget
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*nupkg
