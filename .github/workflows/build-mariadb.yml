name: Build & Run Tests - RepoDb.MariaDb (Push)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.MariaDb/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-mariadb.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.MariaDb
      solution-file: RepoDb.MariaDb.sln
      artifact-name: release-mariadb
      db-engine: mariadb
