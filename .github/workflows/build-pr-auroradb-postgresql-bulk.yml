name: PR - Build & Run Tests - RepoDb.AuroraDb.PostgreSql.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.AuroraDb.PostgreSql/**'
      - 'src/Providers/RepoDb.AuroraDb.PostgreSql.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-auroradb-postgresql-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.AuroraDb.PostgreSql.BulkOperations
      solution-file: RepoDb.AuroraDb.PostgreSql.BulkOperations.sln
      artifact-name: release-pr
      db-engine: auroradbnpgsql
