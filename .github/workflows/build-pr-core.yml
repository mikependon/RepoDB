name: PR - Build & Run Tests - RepoDb.Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-core.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Core
      solution-file: RepoDb.sln
      artifact-name: release-pr
      db-engine: sqlserver
