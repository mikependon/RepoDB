name: PR - Build & Run Tests - RepoDb.Db2.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RepoDb.Core/**'
      - 'RepoDb.Db2/**'
      - 'RepoDb.Extensions/RepoDb.Db2.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-db2-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: RepoDb.Extensions/RepoDb.Db2.BulkOperations
      solution-file: RepoDb.Db2.BulkOperations.sln
      artifact-name: release-pr
      db-engine: db2
