name: PR - Build & Run Tests - RepoDb.DuckDb.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.DuckDb/**'
      - 'src/Providers/RepoDb.DuckDb.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-duckdb-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.DuckDb.BulkOperations
      solution-file: RepoDb.DuckDb.BulkOperations.sln
      artifact-name: release-pr
      db-engine: none
