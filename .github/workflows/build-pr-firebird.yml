name: PR -  Build & Run Tests - RepoDb.Firebird

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Firebird/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-firebird.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Firebird
      solution-file: RepoDb.Firebird.sln
      artifact-name: release-pr
      db-engine: firebird
