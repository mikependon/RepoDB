name: PR - Build & Run Tests - RepoDb.MariaDb

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RepoDb.Core/**'
      - 'RepoDb.MariaDb/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-mariadb.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: RepoDb.MariaDb
      solution-file: RepoDb.MariaDb.sln
      artifact-name: release-pr
      db-engine: mariadb
