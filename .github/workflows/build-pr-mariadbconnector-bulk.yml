name: PR - Build & Run Tests - RepoDb.MariaDbConnector.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.MariaDbConnector/**'
      - 'src/Providers/RepoDb.MariaDbConnector.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-mariadbconnector-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.MariaDbConnector.BulkOperations
      solution-file: RepoDb.MariaDbConnector.BulkOperations.sln
      artifact-name: release-pr
      db-engine: mariadb
