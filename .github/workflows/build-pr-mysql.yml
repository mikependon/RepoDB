name: PR - Build & Run Tests - RepoDb.MySql

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.MySql/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-mysql.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.MySql
      solution-file: RepoDb.MySql.sln
      artifact-name: release-pr
      db-engine: mysql
