name: PR - Build & Run Tests - RepoDb.MySqlConnector.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.MySqlConnector/**'
      - 'src/Providers/RepoDb.MySqlConnector.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-mysqlconnector-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.MySqlConnector.BulkOperations
      solution-file: RepoDb.MySqlConnector.BulkOperations.sln
      artifact-name: release-pr
      db-engine: mysql
