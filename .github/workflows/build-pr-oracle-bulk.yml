name: PR - Build & Run Tests - RepoDb.Oracle.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Oracle/**'
      - 'src/Providers/RepoDb.Oracle.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-oracle-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Oracle.BulkOperations
      solution-file: RepoDb.Oracle.BulkOperations.sln
      artifact-name: release-pr
      db-engine: oracle
