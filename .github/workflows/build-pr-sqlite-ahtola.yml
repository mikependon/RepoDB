name: PR - Build & Run Tests - RepoDb.Sqlite.Ahtola

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Sqlite.Ahtola/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-sqlite-ahtola.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Sqlite.Ahtola
      solution-file: RepoDb.Sqlite.Ahtola.sln
      artifact-name: release-pr
      db-engine: none
