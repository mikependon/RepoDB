name: PR - Build & Run Tests - RepoDb.Sqlite.Microsoft

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Sqlite.Microsoft/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-sqlite-microsoft.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Sqlite.Microsoft
      solution-file: RepoDb.Sqlite.Microsoft.sln
      artifact-name: release-pr
      db-engine: none
