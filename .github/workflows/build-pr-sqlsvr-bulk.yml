name: PR - Build & Run Tests - RepoDb.SqlServer.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.SqlServer/**'
      - 'src/Providers/RepoDb.SqlServer.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-sqlsvr-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.SqlServer.BulkOperations
      solution-file: RepoDb.SqlServer.BulkOperations.sln
      artifact-name: release-pr
      db-engine: sqlserver
