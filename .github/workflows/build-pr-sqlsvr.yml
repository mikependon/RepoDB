name: PR -  Build & Run Tests - RepoDb.SqlServer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.SqlServer/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-sqlsvr.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.SqlServer
      solution-file: RepoDb.SqlServer.sln
      artifact-name: release-pr
      db-engine: sqlserver
