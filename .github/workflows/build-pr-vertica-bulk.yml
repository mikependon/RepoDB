name: PR - Build & Run Tests - RepoDb.Vertica.BulkOperations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Vertica/**'
      - 'src/Providers/RepoDb.Vertica.BulkOperations/**'
      - '.github/workflows/build-base.yml'
      - '.github/workflows/build-pr-vertica-bulk.yml'

jobs:
  build:
    uses: ./.github/workflows/build-base.yml
    with:
      solution-dir: src/Providers/RepoDb.Vertica.BulkOperations
      solution-file: RepoDb.Vertica.BulkOperations.sln
      artifact-name: release-pr
      db-engine: vertica
