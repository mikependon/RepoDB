name: Build & Run Tests - RepoDb.Turso

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Turso/**'
      - 'src/Providers/RepoDb.Sqlite.Microsoft/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - '.github/workflows/build-turso.yml'
  pull_request:
    paths:
      - 'src/Providers/RepoDb.Core/**'
      - 'src/Providers/RepoDb.Turso/**'
      - 'src/Providers/RepoDb.Sqlite.Microsoft/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - '.github/workflows/build-turso.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/Providers/RepoDb.Turso
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build
        run: dotnet build RepoDb.Turso.sln -c Release
      - name: Test .NET 8
        run: dotnet test --solution RepoDb.Turso.sln -c Release -f net8.0 --no-build
      - name: Test .NET 9
        run: dotnet test --solution RepoDb.Turso.sln -c Release -f net9.0 --no-build
      - name: Test .NET 10
        run: dotnet test --solution RepoDb.Turso.sln -c Release -f net10.0 --no-build
      - name: Pack
        run: dotnet pack RepoDb.Turso/RepoDb.Turso.csproj -c Release --no-build -p:Version=1.14.0-dev-${{ github.run_number }} -o release
      - uses: actions/upload-artifact@v5
        with:
          name: release-turso-${{ matrix.os }}
          path: src/Providers/RepoDb.Turso/release/*.nupkg
